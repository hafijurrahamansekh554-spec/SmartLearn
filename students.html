<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management - SmartLearn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* NAVBAR */

nav{
    height:72px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    text-decoration:none;
    color:#4f46e5;
    font-size:25px;
    font-weight:800;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:20px;
}

.nav-links a{
    text-decoration:none;
    color:#4b5563;
    font-weight:600;
}

.nav-links a:hover{
    color:#4f46e5;
}

.back-btn{
    background:#eef2ff;
    color:#4338ca !important;
    padding:9px 15px;
    border-radius:9px;
}

/* HERO */

.hero{
    background:linear-gradient(
        135deg,
        #111827,
        #4f46e5
    );

    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.hero p{
    opacity:.9;
}

/* CONTAINER */

.container{
    width:min(1150px,92%);
    margin:40px auto;
}

/* TOP CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.stat{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.stat-icon{
    font-size:30px;
    margin-bottom:8px;
}

.stat-number{
    font-size:30px;
    font-weight:800;
    color:#4f46e5;
}

.stat-title{
    color:#6b7280;
    margin-top:5px;
}

/* MANAGEMENT CARD */

.management{
    background:white;
    margin-top:25px;
    padding:28px;
    border-radius:20px;
    border:1px solid #e5e7eb;
    box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.management h2{
    margin-bottom:20px;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:12px;
    margin-bottom:25px;
}

.search-box input{
    flex:1;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

.search-box input:focus{
    border-color:#6366f1;
    box-shadow:
        0 0 0 4px
        rgba(99,102,241,.1);
}

/* TABLE */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:15px;
    text-align:left;
    border-bottom:1px solid #edf0f4;
}

th{
    background:#f8fafc;
    color:#374151;
}

tr:hover{
    background:#fafbff;
}

/* STUDENT */

.student-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.student-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
    );
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.student-name{
    font-weight:700;
}

.student-email{
    color:#6b7280;
    font-size:12px;
    margin-top:3px;
}

/* BADGES */

.badge{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.admin{
    background:#ede9fe;
    color:#6d28d9;
}

/* ACTION */

.delete-btn{
    border:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.delete-btn:hover{
    background:#fecaca;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

/* FOOTER */

footer{
    margin-top:60px;
    background:#111827;
    color:white;
    text-align:center;
    padding:30px;
}

footer p{
    color:#9ca3af;
    margin-top:7px;
}

/* RESPONSIVE */

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .nav-links a:not(.back-btn){
        display:none;
    }

}

@media(max-width:550px){

    .hero h1{
        font-size:30px;
    }

    .management{
        padding:20px;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <a
        href="index.html"
        class="logo">
        SmartLearn
    </a>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a
            href="admin.html"
            class="back-btn">
            ← Admin Panel
        </a>

    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <h1>
        👨‍🎓 Student Management
    </h1>

    <p>
        View and manage SmartLearn student accounts.
    </p>

</section>


<main class="container">

    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-icon">
                👨‍🎓
            </div>

            <div
                class="stat-number"
                id="totalStudents">
                0
            </div>

            <div class="stat-title">
                Total Students
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                👑
            </div>

            <div
                class="stat-number"
                id="totalAdmins">
                0
            </div>

            <div class="stat-title">
                Administrators
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                📅
            </div>

            <div
                class="stat-number"
                id="recentStudents">
                0
            </div>

            <div class="stat-title">
                Recent Students
            </div>

        </div>

    </section>


    <!-- MANAGEMENT -->

    <section class="management">

        <h2>
            📋 Registered Users
        </h2>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name or email..."
                oninput="searchStudents()">

        </div>


        <!-- TABLE -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Joined
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="studentTable">
                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>

    <strong>
        SmartLearn Admin
    </strong>

    <p>
        Student Management System
    </p>

</footer>


<script>

/* ================= ADMIN CHECK ================= */

let currentUser = null;

try{

    currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );

}catch{

    currentUser = null;

}


if(!currentUser){

    window.location.href =
        "login.html";

}


/* ================= USERS ================= */

let users = [];

try{

    users =
        JSON.parse(
            localStorage.getItem(
                "users"
            )
        ) || [];

}catch{

    users = [];

}


/* ================= STUDENTS ================= */

function getStudents(){

    return users.filter(
        user =>
            user.role !== "admin"
    );

}


/* ================= STATISTICS ================= */

function updateStatistics(){

    const students =
        getStudents();


    const admins =
        users.filter(
            user =>
                user.role === "admin"
        );


    document.getElementById(
        "totalStudents"
    ).textContent =
        students.length;


    document.getElementById(
        "totalAdmins"
    ).textContent =
        admins.length;


    const now =
        Date.now();


    const sevenDays =
        7 * 24 * 60 * 60 * 1000;


    const recent =
        students.filter(
            user => {

                if(!user.createdAt){

                    return false;

                }

                const date =
                    new Date(
                        user.createdAt
                    ).getTime();


                return (
                    now - date <=
                    sevenDays
                );

            }
        );


    document.getElementById(
        "recentStudents"
    ).textContent =
        recent.length;

}


/* ================= DISPLAY ================= */

function displayStudents(
    studentList
){

    const table =
        document.getElementById(
            "studentTable"
        );


    table.innerHTML = "";


    if(
        studentList.length === 0
    ){

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    👨‍🎓
                    <br><br>

                    No students found.

                </td>

            </tr>

        `;

        return;

    }


    studentList.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );


            const name =
                user.name ||
                "Student";


            const email =
                user.email ||
                "No email";


            const firstLetter =
                name
                    .charAt(0)
                    .toUpperCase();


            let joined =
                "Unknown";


            if(user.createdAt){

                const date =
                    new Date(
                        user.createdAt
                    );


                if(!isNaN(date)){

                    joined =
                        date.toLocaleDateString(
                            "en-IN",
                            {
                                day:"numeric",
                                month:"short",
                                year:"numeric"
                            }
                        );

                }

            }


            row.innerHTML = `

                <td>

                    <div class="student-info">

                        <div
                            class="student-avatar">

                            ${firstLetter}

                        </div>

                        <div>

                            <div
                                class="student-name">

                                ${escapeHTML(
                                    name
                                )}

                            </div>

                            <div
                                class="student-email">

                                ${escapeHTML(
                                    email
                                )}

                            </div>

                        </div>

                    </div>

                </td>


                <td>

                    <span class="badge active">

                        Student

                    </span>

                </td>


                <td>

                    ${joined}

                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteStudent('${user.id}')">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* ================= SEARCH ================= */

function searchStudents(){

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const students =
        getStudents();


    if(!search){

        displayStudents(
            students
        );

        return;

    }


    const filtered =
        students.filter(
            user => {

                const name =
                    (
                        user.name ||
                        ""
                    ).toLowerCase();


                const email =
                    (
                        user.email ||
                        ""
                    ).toLowerCase();


                return (
                    name.includes(
                        search
                    ) ||
                    email.includes(
                        search
                    )
                );

            }
        );


    displayStudents(
        filtered
    );

}


/* ================= DELETE ================= */

function deleteStudent(
    studentId
){

    const student =
        users.find(
            user =>
                user.id ===
                studentId
        );


    if(!student){

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete " +
            (student.name || "this student") +
            "?"
        );


    if(!confirmDelete){

        return;

    }


    users =
        users.filter(
            user =>
                user.id !==
                studentId
        );


    localStorage.setItem(
        "users",
        JSON.stringify(
            users
        )
    );


    updateStatistics();

    searchStudents();

}


/* ================= SECURITY ================= */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================= START ================= */

updateStatistics();

displayStudents(
    getStudents()
);

</script>

</body>
</html>
